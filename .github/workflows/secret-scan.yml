name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan tracked files for plaintext secrets
        run: |
          set -Eeuo pipefail
          echo "Scanning tracked files (no secret values are printed)..."
          # 1) Private keys must never be committed.
          if git grep -n --cached -E 'BEGIN (RSA )?PRIVATE KEY|BEGIN OPENSSH PRIVATE KEY' -- . ; then
            echo "::error::Private key material found in tracked files."
            exit 1
          fi
          # 2) Previously exposed credential placeholder must not return.
          if git grep -n --cached -F 'zeaz-cinema-2026' -- . ; then
            echo "::error::Previously exposed credential pattern found."
            exit 1
          fi
          # 3) Passwords on CLI flags in scripts.
          if git grep -n --cached -E -- '--password=' -- 'scripts/*.sh' 'wp-installer/*.sh' 'install*.sh' ; then
            echo "::error::Inline --password= flag found in scripts (use --defaults-file or env)."
            exit 1
          fi
          # 4) Env files must never be tracked.
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.' ; then
            echo "::error::Env file tracked in git."
            exit 1
          fi
          echo "Secret scan passed."
