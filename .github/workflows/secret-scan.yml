name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan tracked files for plaintext secrets
        # Structure-aware PEM detection lives in scripts/secret-scan.sh so the
        # rule stays auditable in one place and regression-testable.
        run: bash scripts/secret-scan.sh
