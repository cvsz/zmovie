name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate documentation
        run: python scripts/verify_docs.py

      - name: Compile application
        run: python -m compileall -q zmovie.py app.py main.py zmovie_platform tests

      - name: Validate Makefile and control CLI
        run: |
          make help >/dev/null
          python -m zmovie_platform.control_cli --help | grep -q 'production control plane'
          python -m zmovie_platform.control_cli hyperframes | python -m json.tool >/dev/null
          python -m zmovie_platform.control_cli sdcpp-status | python -m json.tool >/dev/null

      - name: Validate Studio JavaScript and Hyperframes assets
        run: |
          node --check static/app.js
          node --check static/studio-preview.js
          node --check static/hyperframes-studio.js
          test -f static/images/hyperframes/template-product-showcase.svg
          test -f static/images/hyperframes/template-discount-alert.svg
          test -f static/images/hyperframes/template-comparison.svg
          test -f static/images/hyperframes/template-testimonial-style.svg
          test -f static/images/hyperframes/template-social-short-cut.svg

      - name: Validate installers and operations scripts
        run: bash -n install.sh install-docker.sh scripts/configure-comfyui.sh scripts/configure-remote-comfyui.sh scripts/configure-sdcpp.sh scripts/install-comfyui.sh scripts/install-sdcpp.sh scripts/install-bilibili-session.sh scripts/verify-bilibili-session.sh scripts/list-bilibili-publish-candidates.sh scripts/create-bilibili-launch-candidate.sh scripts/reset-production-projects.sh scripts/production-gen.sh scripts/production-release.sh scripts/preflight-bilibili-publish.sh scripts/confirm-bilibili-publication.sh scripts/copy-github-environment.sh scripts/smoke-zmovie-comfyui.sh scripts/smoke-production-video.sh scripts/smoke-project-assembly.sh scripts/smoke-bilibili-package.sh scripts/doctor.sh scripts/zmovie-ctl.sh

      - name: Smoke project reset guard
        run: |
          python -m zmovie_platform.project_reset list | python -m json.tool >/dev/null
          test "$(python -m zmovie_platform.project_reset delete --confirm WRONG >/tmp/reset.out 2>&1; echo $?)" -eq 2
          grep -q 'confirmation must be DELETE-ALL-PRJ' /tmp/reset.out

      - name: Runtime smoke Bilibili candidate helper
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .venv/bin
          ln -sf "$(command -v python)" .venv/bin/python
          env_file="$(mktemp)"
          db_file="$(mktemp -u)"
          printf 'ZMOVIE_DB_PATH=%s\n' "$db_file" > "$env_file"
          chmod 0644 "$env_file"
          sudo env \
            ZMOVIE_INSTALL_DIR="$GITHUB_WORKSPACE" \
            ZMOVIE_ENV="$env_file" \
            ZMOVIE_SERVICE_USER="$(id -un)" \
            bash scripts/list-bilibili-publish-candidates.sh \
            | tee /tmp/zmovie-bilibili-candidates.json
          grep -q '"count": 0' /tmp/zmovie-bilibili-candidates.json
          rm -f "$env_file" "$db_file"

      - name: Validate ComfyUI smoke workflow
        run: python -m json.tool workflows/comfyui/smoke_api.json > /dev/null

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Smoke test text output
        run: python zmovie.py --seed 42 --count 2 > /tmp/zmovie-prompts.txt

      - name: Smoke test JSON output
        run: python zmovie.py --seed 42 --json | python -m json.tool > /dev/null

      - name: Smoke test hardened publisher CLI without external login
        run: |
          python -m zmovie_platform.publishers.bilibili_hardened --help | grep -q 'sanitize-state'
          python -m zmovie_platform.publishers.bilibili_preflight --help | grep -q -- '--job'
          python -m zmovie_platform.publishers.bilibili_confirm --help | grep -q -- '--url'
          python -m zmovie_platform.publishers.bilibili_launch_candidate --help | grep -q -- '--duration'
          python -m zmovie_platform.bilibili_media --help >/dev/null || true
          python -m zmovie_platform.publishers.bilibili_hardened session --no-probe | python -m json.tool > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production container
        run: docker build -t zmovie:test .

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies and quality tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.16.1 pip-audit==2.10.1

      - name: Run focused Python lint
        run: ruff check app.py main.py zmovie_platform tests

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install.sh install-docker.sh scripts/*.sh

      - name: Validate frontend JavaScript
        run: |
          node --check static/app.js
          node --check static/studio-preview.js
          node --check static/hyperframes-studio.js
