name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q zmovie.py app.py main.py zmovie_platform tests

      - name: Validate installers
        run: bash -n install.sh install-docker.sh scripts/configure-comfyui.sh scripts/install-comfyui.sh

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Smoke test text output
        run: python zmovie.py --seed 42 --count 2 > /tmp/zmovie-prompts.txt

      - name: Smoke test JSON output
        run: python zmovie.py --seed 42 --json | python -m json.tool > /dev/null

      - name: Smoke test publisher CLI without external login
        run: python -m zmovie_platform.publishers.bilibili status | python -m json.tool > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build -t zmovie:test .
