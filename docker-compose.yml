services:
  zmovie:
    build: .
    restart: unless-stopped
    ports:
      - "${ZMOVIE_PORT:-8080}:8080"
    environment:
      ZMOVIE_DB_PATH: /app/data/zmovie.db
      ZMOVIE_MEDIA_ROOT: /app/data/media
      ZMOVIE_EXPORT_ROOT: /app/data/exports
      ZMOVIE_AUTH_ENABLED: "${ZMOVIE_AUTH_ENABLED:-true}"
      ZMOVIE_SECRET_KEY: "${ZMOVIE_SECRET_KEY:-zmovie-change-this-before-internet-exposure}"
      ZMOVIE_ADMIN_USER: "${ZMOVIE_ADMIN_USER:-admin}"
      ZMOVIE_ADMIN_PASSWORD: "${ZMOVIE_ADMIN_PASSWORD:-}"
      ZMOVIE_PROVIDER_WEBHOOK: "${ZMOVIE_PROVIDER_WEBHOOK:-}"
      ZMOVIE_PROVIDER_TOKEN: "${ZMOVIE_PROVIDER_TOKEN:-}"
      ZMOVIE_COMFYUI_URL: "${ZMOVIE_COMFYUI_URL:-http://host.docker.internal:8188}"
      ZMOVIE_COMFYUI_WORKFLOW: "${ZMOVIE_COMFYUI_WORKFLOW:-/app/workflows/comfyui/workflow_api.json}"
      ZMOVIE_COMFYUI_TOKEN: "${ZMOVIE_COMFYUI_TOKEN:-}"
      ZMOVIE_COMFYUI_HEADERS_JSON: "${ZMOVIE_COMFYUI_HEADERS_JSON:-}"
      ZMOVIE_COMFYUI_TIMEOUT: "${ZMOVIE_COMFYUI_TIMEOUT:-3600}"
      ZMOVIE_COMFYUI_POLL_INTERVAL: "${ZMOVIE_COMFYUI_POLL_INTERVAL:-2}"
      ZMOVIE_COMFYUI_FPS: "${ZMOVIE_COMFYUI_FPS:-16}"
      ZMOVIE_COMFYUI_FRAME_MULTIPLE: "${ZMOVIE_COMFYUI_FRAME_MULTIPLE:-4}"
      ZMOVIE_COMFYUI_FRAME_OFFSET: "${ZMOVIE_COMFYUI_FRAME_OFFSET:-1}"
      ZMOVIE_COMFYUI_FILENAME_PREFIX: "${ZMOVIE_COMFYUI_FILENAME_PREFIX:-zmovie}"
      ZMOVIE_COMFYUI_POSITIVE_NODE_IDS: "${ZMOVIE_COMFYUI_POSITIVE_NODE_IDS:-}"
      ZMOVIE_COMFYUI_NEGATIVE_NODE_IDS: "${ZMOVIE_COMFYUI_NEGATIVE_NODE_IDS:-}"
      ZMOVIE_COMFYUI_SEED_NODE_IDS: "${ZMOVIE_COMFYUI_SEED_NODE_IDS:-}"
      ZMOVIE_COMFYUI_FRAMES_NODE_IDS: "${ZMOVIE_COMFYUI_FRAMES_NODE_IDS:-}"
      ZMOVIE_COMFYUI_SIZE_NODE_IDS: "${ZMOVIE_COMFYUI_SIZE_NODE_IDS:-}"
    volumes:
      - zmovie-data:/app/data
      - ./workflows/comfyui:/app/workflows/comfyui:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v2/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  zmovie-data:
