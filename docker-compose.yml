services:
  zmovie:
    build: .
    container_name: zmovie
    restart: unless-stopped
    environment:
      ZMOVIE_HOST: 0.0.0.0
      ZMOVIE_PORT: 8080
      ZMOVIE_DATA_DIR: /app/data
    ports:
      - "${ZMOVIE_PORT:-8080}:8080"
    volumes:
      - zmovie-data:/app/data

volumes:
  zmovie-data:
